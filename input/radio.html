<!DOCTYPE html>

<html>
<head>

    <meta name="viewport" content="width=device-width, maximum-scale=1.0">

    <title></title>

    <style>
    
        #RadioGrid
        {
            display:grid;
            grid-template-columns:auto min-content;
            align-items:center;
            border:1px solid black
        }
        
        label
        {
            text-align:right;
        }
        
        input[type=radio]
        {
            position: relative;
            width:20px; 
            height:20px;
            transform: scale(1.5);
            margin:10px;
        }


        input[type=radio]:checked::before
        {
            content: '';
            position: absolute;
            top:20%;
            left: 20%;
            width:60%; 
            height:60%;
            display: block;
            border-radius: 50%;
            background-color:#003366;
        }


        input[type=radio]::after
        {
            content: '';
            position: absolute;
            top:0;
            left: 0;
            width:100%; 
            height:100%;
            display: block;
            border: 1px solid #003366;
            box-sizing: border-box;
            border-radius: 50%;
            background-color:transparent;
        }


        input[type=radio]:not(:checked):hover::before
        {
            content: '';
            width:100%; 
            height:100%;
            position: absolute;
            top:0;
            left: 0;
            display: block;
            border: 1px solid rgb(8, 174, 239);
            box-sizing: border-box;
            border-radius: 50%;
            background-color:#CCEFFC;
        }

        input[type=radio]:not(:checked):hover::after
        {
            border: none;
        }

    </style>

</head>
<body>


<div id="RadioGrid">
    <label for="radio1">אתר הכרויות</label><input type="radio" id="radio1" name="radioButton" />
    <label for="radio2">חיפוש עבודה</label><input type="radio" id="radio2" name="radioButton" />
    <label for="radio3">אחר</label><input type="radio" id="radio3" name="radioButton" />
</div>


</body>
</html>
