<!DOCTYPE html>

<html>

<head>

    <title></title>

    <style>
    
        .flexContainer
        {
            width:200px;
            height:300px;
            display:flex;
            flex-wrap:wrap;
            margin:30px 0;
            padding:20px;
            background-color:yellow;
        }
    
    
        .item
        {
            width:50px;
            height:100px;
            outline:1px solid black;
            text-align:center;
            background-color:white;
        }
    
    </style>

</head>


<body>


    <h1>flex-direction:column</h1>
    <div>The flex-direction property defines in which direction the container wants to stack the flex items.</div>
    <div>The column value stacks the flex items vertically (from top to bottom):</div>

    <div class="flexContainer" style="flex-direction:column">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>


    <div class="flexContainer" style="flex-direction:column-reverse">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>


</body>
</html>
