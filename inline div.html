<!DOCTYPE html>

<html>
<head>
    <title></title>
</head>
<body>


<h3>in line div using float:left</h3>
<div style="width:200px; height:30px; float:left; background-color:Aqua">div 1</div>
<div style="width:100px; height:30px; float:left; background-color:Lime">div 2</div>
<div style="width:100px; height:30px; float:left; background-color:Olive">div 3</div>

<!-- break the float -->
<div style="clear:both"></div>


<h3>in line div using display:inline-block (set the divs in one line to remove space between the elements)</h3>
<div style="width:200px; height:30px; display:inline-block; background-color:Orange">div 1</div><div style="width:100px; height:30px; display:inline-block; background-color:Yellow">div 2</div><div style="width:100px; height:30px; display:inline-block; background-color:Fuchsia">div 3</div>



<h3>read more</h3>
https://css-tricks.com/fighting-the-space-between-inline-block-elements/

</body>
</html>
