<!DOCTYPE html>

<html>

<head>
    <title></title>

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <style>
    
    
   
    .flexContainer
    {
        width:100%;
        display:flex;
        flex-wrap: wrap;
        flex-direction: row-reverse;
        justify-content: flex-start;
        /*background-color:Yellow;*/
    }
    
    
    .item
    {
        display:flex;
        flex-direction: row;
        justify-content: flex-end;
    }
    
    
    
    .divCheckbox
    {
        width:40px;
        padding:10px 20px 10px 0;
        box-sizing:border-box;
        outline:0px solid black;
        /*background-color:Aqua;*/
    }
    
    
    .divLabel
    {
        width:160px;
        padding:10px;
        box-sizing:border-box;
        text-align:right;
        direction:rtl;
        outline:0px solid black;
        /*background-color:Aqua;*/
    }
    
    
    input[type=checkbox]
    {
        width:20px; height:20px; margin:6px 0 0 0;
    }
    
    label
    {
        font-size:20px;
        display:inline-block;
        /*background-color:Lime;*/
    }
    
    </style>

</head>
<body>


    <div class="flexContainer">
        

        <div class="item">
            <div class="divLabel">
                <label for="cb1">
                    לא
                </label>
            </div>
            <div class="divCheckbox">
                <input id="Checkbox2" type="checkbox" />
            </div> 
        </div>



        <div class="item">
            <div class="divLabel">
                <label for="cb1">
                    כן
                </label>
            </div>
            <div class="divCheckbox">
                <input id="Checkbox1" type="checkbox" />
            </div> 
        </div>




        <div class="item">
            <div class="divLabel">
                <label for="cb1">
                    זאב מצוי שוקל בין 23 ל-60 ק"ג, ואורכו הוא בסביבות 1 עד 1.5 מטר עם זנב באורך של כשליש מגופו.
                </label>
            </div>
            <div class="divCheckbox">
                <input id="cb1" type="checkbox" />
            </div> 
        </div>


        <div class="item">
            <div class="divLabel">
                <label for="cb2">
                    משקלו של חתול בית בוגר נע בממוצע בין 4–5 קילוגרם. תוחלת החיים הממוצעת נעה בין 10–15 שנים
                </label>
            </div>
            <div class="divCheckbox">
                <input id="cb2" type="checkbox" />
            </div>
        </div>


        <div class="item">
            <div class="divLabel">
                <label for="cb3">
                    הפומה נקראת גם אריה שלג, או קוגר. הפומה אוכלת אוכלי עשב בגדלים שונים. מכיוון שמיתרי הקול שלה לא מסוגלים להפיק צלילי שאגה, בגלל גודלה הקטן יחסית, היא לא שואגת, אלא מגרגרת, בדומה לחתוליים אחרים, למשל השונר וחתול הביצות.
                </label>
            </div>
            <div class="divCheckbox">
                <input id="cb3" type="checkbox" />
            </div>  
        </div>


        <div class="item">
            <div class="divLabel">
                <label for="cb4">
                    הנמר שוכן ביערות, בערבות, בהרים ובשטחים סלעיים.
                </label>
            </div>
            <div class="divCheckbox">
                <input id="cb4" type="checkbox" />
            </div>
        </div>


        <div class="item">
            <div class="divLabel">
                <label for="cb5">
                    הלוטרות פעילות מאוד, רודפות אחרי טרף במים או על מצע הנהר, קרקעית האגם או קרקעית הים.
                </label>
            </div>
            <div class="divCheckbox">
                <input id="cb5" type="checkbox" />
            </div>
        </div>

        
    </div>



    

</body>
</html>
