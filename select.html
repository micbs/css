<!DOCTYPE html>

<html>
<head>
    <title></title>

    <style>
        #slt option{color:red; background-color:Yellow}
    </style>

</head>
<body>


<h2>select with no style</h2>
<select>
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>



<h2>select with 10px border</h2>
<select style="border:10px solid black">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>




<h2>select with 10px padding</h2>
<select style="padding:10px">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>




<h2>select with 10px margin</h2>
<select style="margin:10px">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>




<h2>select with style on option</h2>
<select id="slt">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>


<p>* option's can not be style, Except for background-color and color, style settings applied through the style object for the option element are ignored.</p>


</body>
</html>
