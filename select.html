<!DOCTYPE html>

<html>
<head>
    <title></title>

    <style>
        #slt option{color:red; background-color:Yellow}
        
        .container select {width: 350px; height: 55px; padding-right:10px; direction:rtl; border:1px solid #D9D9D9; font-size:24px; font-weight:bold; color:#666666; background-color:transparent}
        .container img {position:relative; top:-3px; right:-40px; z-index:-1}
        /* remove the default arrow icon from a select */
        .container select {-webkit-appearance: none; -moz-appearance: none; text-indent: 1px; text-overflow: '';}
    </style>

</head>
<body>


<h2>select with no style</h2>
<select>
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>



<h2>select with 10px border</h2>
<select style="border:10px solid black">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>




<h2>select with 10px padding</h2>
<select style="padding:10px">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>




<h2>select with 10px margin</h2>
<select style="margin:10px">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>




<h2>select with style on option</h2>
<select id="slt">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>

<p>* option's can not be style, Except for background-color and color, style settings applied through the style object for the option element are ignored.</p>


<h2>select with arrow</h2>
<div class="container">
    <img src="images/select-arrow.svg" />
    <select>
        <option>בחר</option>
        <option>cat</option>
        <option>dog</option>
        <option>lion</option>
        <option>fox</option>
    </select>
</div>



</body>
</html>
