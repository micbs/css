<!DOCTYPE html>

<html>
<head>
    <title></title>

    <style>
        #slt1{}
        #slt1 option{color:Green; background-color:Yellow}
    </style>

</head>
<body>

<h2>select with no style</h2>
<select>
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>


<h2>select with style</h2>
<select id="slt1">
    <option>cat</option>
    <option>dog</option>
    <option>lion</option>
    <option>fox</option>
</select>


<p>* option's can not be style, Except for background-color and color, style settings applied through the style object for the option element are ignored.</p>


</body>
</html>
