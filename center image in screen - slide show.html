<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />


    <style>

        body
        {
            margin:0;
        }


        div
        {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:black;
        }


        @media only screen and (orientation:portrait)
        {
            img
            {
                width:90%;
                max-height:90%;
            }
        }
		
		
        @media only screen and (orientation:landscape)
        {
            img
            {
                max-width:90%;
                height:90%;
            }
        }

    </style>

</head>

<body>
    
    <div id="myDiv">
        <img id="MyImage" />
    </div>

    <script>

        let url_array = ["freestocks-org-190062-unsplash.jpg", "ben-white-294636-unsplash.jpg", "philipe-cavalcante-539505-unsplash.jpg", "sage-kirk-485982-unsplash.jpg"];
        let index = 0;

        window.document.body.onkeyup = function (MyEvent)
        {
            if(MyEvent.keyCode == 39)
            {
                if (index + 1 == url_array.length)
                {
                    index = 0;
                }
                else
                {
                    index++;
                }

                load_image();
            }


            if(MyEvent.keyCode == 37)
            {
                if (index - 1 < 0)
                {
                    index = url_array.length - 1;
                }
                else
                {
                    index--;
                }

                load_image();
            }
        };



        function load_image()
        {
            document.querySelector("#MyImage").src = "Images/" + url_array[index];
        }



        load_image();

    </script>

</body>
</html>
