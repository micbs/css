<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Modern Switch Button with JS</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f7f9;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        input:checked+.slider {
            background-color: #00667D;
            box-shadow: 0 0 5px #00667D;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }
    </style>
</head>

<body>

    <label class="switch">
        <input type="checkbox" id="mySwitch">
        <span class="slider"></span>
    </label>

    <script>
        const mySwitch = document.getElementById("mySwitch");

        mySwitch.addEventListener("change", function ()
        {
            if (this.checked)
            {
                onSwitchChecked();
            } else
            {
                onSwitchUnchecked();
            }
        });

        function onSwitchChecked()
        {
            console.log("✅ Switch is ON");
            // put your "checked" logic here
        }

        function onSwitchUnchecked()
        {
            console.log("❌ Switch is OFF");
            // put your "unchecked" logic here
        }
    </script>

</body>

</html>
