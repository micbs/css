<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />
</head>
<body>

    <h1>Pixel density calculator</h1>

    <div style="margin-top:10px">Horizontal pixels:</div><input type="text" id="txtHorizontal" />
    <div style="margin-top:10px">Vertical pixels:</div><input type="text" id="txtVertical" />
    <div style="margin-top:10px">Screen size units in inches:</div><input type="text" id="txtInches" />
    <button onclick="calcPPI()">calc</button>
    <h2 id="result"></h2>
    

    <script>

        function calcPPI()
        {
            var horizontalPX = Number(document.getElementById("txtHorizontal").value);
            var verticalPX = Number(document.getElementById("txtVertical").value);
            var inches = Number(document.getElementById("txtInches").value);

            var ppi = Math.sqrt((horizontalPX * horizontalPX) + (verticalPX * verticalPX)) / inches

            document.getElementById("result").innerHTML = Math.round(ppi) + " ppi";
        }

    </script>

</body>
</html>
