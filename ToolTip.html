<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        #MyDiv {
            width: fit-content;
            direction: rtl;
            padding: 10px;
            background-color: yellow;
            position: relative;
            margin-top: 200px;
            margin-inline: auto;
        }

        .tooltip {
            width: max-content;
            max-width: 300px;
            position: absolute;
            bottom: 100%;
            right: 0;
            /* background-color: blueviolet; */
        }

        .tooltip>div:nth-child(1) {
            background-color: #FDFAF6;
            position: relative;
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
            direction: rtl;
            word-break: normal;
        }

        .tooltip>div:nth-child(2) {
            width: 20px;
            height: 20px;
            position: relative;
            box-sizing: border-box;
            margin-left: auto;
            right: 40px;
            top: -14.14px;
            transform-origin: top right;
            transform: rotate(-45deg);
            border-left: 1px solid black;
            border-bottom: 1px solid black;
            background-color: #FDFAF6;
        }
    </style>

</head>

<body>
    <div id="MyDiv">
        העבר את הסמן על מנת להציג פרטים על הכלב
    </div>

    <script>


        document.getElementById("MyDiv").addEventListener("mouseover", (e) =>
        {
            if (e.currentTarget.querySelector(".tooltip") === null)
            {
                const divToolTip = document.createElement("div");
                divToolTip.className = "tooltip";

                const divText = document.createElement("div");
                divText.innerHTML = "כלב הוא שמו היומיומי של כלב הבית (שם מדעי: Canis lupus familiaris), תת-מין של הזאב המצוי (Canis lupus), ממשפחת הכלביים, מסדרת היונקים הטורפים.";

                const divTriangle = document.createElement("div");

                divToolTip.appendChild(divText);
                divToolTip.appendChild(divTriangle);
                e.currentTarget.appendChild(divToolTip);
            }
        })



        document.getElementById("MyDiv").addEventListener("mouseout", (e) =>
        {
            if (e.currentTarget.querySelector(".tooltip") !== null)
            {
                e.currentTarget.querySelector(".tooltip").remove();
            }
        })

    </script>

</body>

</html>
