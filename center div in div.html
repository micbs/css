<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />


    <style>

        #div1
        {
            width:300px;
            height:400px;
            position:relative;
            background-color:yellow;
        }

        #div1 > div
        {
            width:50%;
            position:absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size:30px;
            background-color:pink;
        }

    </style>

</head>
<body>

    <div id="div1">
        <div>hello world good morning</div>
    </div>

</body>
</html>
