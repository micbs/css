<html>
	<head>
		<script   src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
		<style>
			.clock {
				height: 400px;
				width: 400px;
				position: fixed;
				top: 300px;
				left: 300px;
				border-radius: 50%;
				border: 1px solid black;
			}
			
			
			.knot {
				width: 150px;
				background-color: black;
				height: 1px;
				position: fixed;
				top:500px;
				left:500px;
				transition: transform 1s;
				transform-origin: 0px 0px;
				transform: rotate(270deg);
			}
			
			
			
		</style>
		<script>
		$(document).ready(function(){
			var rotateAng = 270;
			setInterval(function(){
			rotateAng += 6;
				$(".knot").css("transform", "rotate(" + rotateAng + "deg)");
			}, 1000);
		
		});
			
			
			
		</script>
		
	</head>
	<body>	
		
		<div class="clock"></div>
		<div class="knot"></div>
		
	</body>
</html>
