<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />


    <style>

        body
        {
            margin:0;
        }


        div
        {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:black;
        }


        @media only screen and (orientation:portrait)
        {
            img
            {
                width:90%;
                max-height:90%;
            }
        }
		
		
        @media only screen and (orientation:landscape)
        {
            img
            {
                max-width:90%;
                height:90%;
            }
        }

    </style>

</head>
<body>
    <div>
        <img src="images/freestocks-org-190062-unsplash.jpg" />
    </div>
</body>
</html>
