<html>
<head>

    <style>

            .container{flex-direction:column}
        }

    </style>

</head>
<body>

    <div class="container">
        <div>ספורט</div>
        <div>תרבות</div>
        <div>כלכלה</div>
        <div>אופנה</div>
        <div>אוכל</div>
        <div>חדשות</div>
    </div>

</body>
</html>
