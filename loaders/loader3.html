<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />



    <style>

        .speeding-wheel 
        {
	        width: 100px;
	        height: 100px;
	        position:fixed;
	        top:50%;
	        left:50%;
	        margin-top:-50px;
	        margin-left:-50px;
	        border: 6px solid rgb(96,219,24);
	        border-radius: 50%;
	        border-left-color: transparent;
	        border-right-color: transparent;
	        animation: cssload-spin 1s infinite linear;
        }


        @keyframes cssload-spin {
	        100%{ transform: rotate(360deg); }
        }

    </style>

</head>


<body>

    
    <div id="wheel"></div>
    
    <button onclick="start_loader()">start loader</button>
    <button onclick="stop_loader()">stop loader</button>


    <script>

        function start_loader()
        {
            document.getElementById("wheel").className = "speeding-wheel";
        }


        function stop_loader()
        {
            document.getElementById("wheel").className = "";
        }

    </script>

</body>
</html>
