<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, user-scalable=0" />


    <style>

        #circularG {
            position: fixed;
            width: 58px;
            height: 58px;
            top:50%;
            left:50%;
            margin-top:-29px;
            margin-left:-29px;
        }

        .circularG {
            position: absolute;
            background-color: Green;
            width: 14px;
            height: 14px;
            border-radius: 9px;
            -o-border-radius: 9px;
            -ms-border-radius: 9px;
            -webkit-border-radius: 9px;
            -moz-border-radius: 9px;
            animation-name: bounce_circularG;
            -o-animation-name: bounce_circularG;
            -ms-animation-name: bounce_circularG;
            -webkit-animation-name: bounce_circularG;
            -moz-animation-name: bounce_circularG;
            animation-duration: 1.1s;
            -o-animation-duration: 1.1s;
            -ms-animation-duration: 1.1s;
            -webkit-animation-duration: 1.1s;
            -moz-animation-duration: 1.1s;
            animation-iteration-count: infinite;
            -o-animation-iteration-count: infinite;
            -ms-animation-iteration-count: infinite;
            -webkit-animation-iteration-count: infinite;
            -moz-animation-iteration-count: infinite;
            animation-direction: normal;
            -o-animation-direction: normal;
            -ms-animation-direction: normal;
            -webkit-animation-direction: normal;
            -moz-animation-direction: normal;
            transform: scale(0);
            -o-transform: scale(0);
            -ms-transform: scale(0);
            -webkit-transform: scale(0);
            -moz-transform: scale(0);
        }

        #circularG_1 {
            left: 0;
            top: 23px;
            animation-delay: 0;
            -o-animation-delay: 0;
            -ms-animation-delay: 0;
            -webkit-animation-delay: 0;
            -moz-animation-delay: 0;
        }

        #circularG_2 {
            left: 6px;
            top: 6px;
            animation-delay: 0.14s;
            -o-animation-delay: 0.14s;
            -ms-animation-delay: 0.14s;
            -webkit-animation-delay: 0.14s;
            -moz-animation-delay: 0.14s;
        }

        #circularG_3 {
            top: 0;
            left: 23px;
            animation-delay: 0.28s;
            -o-animation-delay: 0.28s;
            -ms-animation-delay: 0.28s;
            -webkit-animation-delay: 0.28s;
            -moz-animation-delay: 0.28s;
        }

        #circularG_4 {
            right: 6px;
            top: 6px;
            animation-delay: 0.42s;
            -o-animation-delay: 0.42s;
            -ms-animation-delay: 0.42s;
            -webkit-animation-delay: 0.42s;
            -moz-animation-delay: 0.42s;
        }

        #circularG_5 {
            right: 0;
            top: 23px;
            animation-delay: 0.56s;
            -o-animation-delay: 0.56s;
            -ms-animation-delay: 0.56s;
            -webkit-animation-delay: 0.56s;
            -moz-animation-delay: 0.56s;
        }

        #circularG_6 {
            right: 6px;
            bottom: 6px;
            animation-delay: 0.70s;
            -o-animation-delay: 0.70s;
            -ms-animation-delay: 0.70s;
            -webkit-animation-delay: 0.70s;
            -moz-animation-delay: 0.70s;
        }

        #circularG_7 {
            left: 23px;
            bottom: 0;
            animation-delay: 0.84s;
            -o-animation-delay: 0.84s;
            -ms-animation-delay: 0.84s;
            -webkit-animation-delay: 0.84s;
            -moz-animation-delay: 0.84s;
        }

        #circularG_8 {
            left: 6px;
            bottom: 6px;
            animation-delay: 0.98s;
            -o-animation-delay: 0.98s;
            -ms-animation-delay: 0.98s;
            -webkit-animation-delay: 0.98s;
            -moz-animation-delay: 0.98s;
        }



        @keyframes bounce_circularG {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(.3);
            }
        }

        @-o-keyframes bounce_circularG {
            0% {
                -o-transform: scale(1);
            }

            100% {
                -o-transform: scale(.3);
            }
        }

        @-ms-keyframes bounce_circularG {
            0% {
                -ms-transform: scale(1);
            }

            100% {
                -ms-transform: scale(.3);
            }
        }

        @-webkit-keyframes bounce_circularG {
            0% {
                -webkit-transform: scale(1);
            }

            100% {
                -webkit-transform: scale(.3);
            }
        }

        @-moz-keyframes bounce_circularG {
            0% {
                -moz-transform: scale(1);
            }

            100% {
                -moz-transform: scale(.3);
            }
        }

    </style>

</head>

<body>

    <div id="circularG">
        <div id="circularG_1"></div>
        <div id="circularG_2"></div>
        <div id="circularG_3"></div>
        <div id="circularG_4"></div>
        <div id="circularG_5"></div>
        <div id="circularG_6"></div>
        <div id="circularG_7"></div>
        <div id="circularG_8"></div>
    </div>


    <button onclick="start_loader()">start loader</button>
    <button onclick="stop_loader()">stop loader</button>


    <script>

        function start_loader() {
            document.getElementById("circularG_1").className = "circularG";
            document.getElementById("circularG_2").className = "circularG";
            document.getElementById("circularG_3").className = "circularG";
            document.getElementById("circularG_4").className = "circularG";
            document.getElementById("circularG_5").className = "circularG";
            document.getElementById("circularG_6").className = "circularG";
            document.getElementById("circularG_7").className = "circularG";
            document.getElementById("circularG_8").className = "circularG";
        }


        function stop_loader() {
            document.getElementById("circularG_1").className = "";
            document.getElementById("circularG_2").className = "";
            document.getElementById("circularG_3").className = "";
            document.getElementById("circularG_4").className = "";
            document.getElementById("circularG_5").className = "";
            document.getElementById("circularG_6").className = "";
            document.getElementById("circularG_7").className = "";
            document.getElementById("circularG_8").className = "";
        }
    
    
    
    </script>


</body>
</html>
