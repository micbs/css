<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple CSS Spinner</title>
    <style>
        /* ===== Spinner core ===== */
        .loader {
            width: 3rem;
            /* overall size  */
            height: 3rem;
            border: .35rem solid #d1d5db;
            /* light grey ring */
            border-top-color: black;
            /* coloured arc   */
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Demo layout (optional) ===== */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f9fafb;
        }
    </style>
</head>

<body>
    <div class="loader" role="status" aria-label="Loading"></div>
</body>

</html>
