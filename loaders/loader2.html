<!DOCTYPE html>
<html>
<head>
    <title></title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, maximum-scale=1.0">


    <style>

        #fountainG {
            position: fixed;
            width: 234px;
            height: 28px;
            top:50%;
            left:50%;
            margin-top:-14px;
            margin-left:-117px; 
        }


        .fountainG {
            position: absolute;
            top: 0;
            background-color: rgb(10,140,140);
            width: 28px;
            height: 28px;
            animation-name: bounce_fountainG;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            transform: scale(0);
            border-radius: 19px;
        }

        #fountainG_1 {
            left: 0;
            animation-delay: 0s;
        }

        #fountainG_2 {
            left: 29px;
            animation-delay: 0.15s;
        }

        #fountainG_3 {
            left: 58px;
            animation-delay: 0.3s;
        }

        #fountainG_4 {
            left: 88px;
            animation-delay: 0.45s;
        }

        #fountainG_5 {
            left: 117px;
            animation-delay: 0.6s;
        }

        #fountainG_6 {
            left: 146px;
            animation-delay: 0.75s;
        }

        #fountainG_7 {
            left: 175px;
            animation-delay: 0.9s;
        }

        #fountainG_8 {
            left: 205px;
            animation-delay: 1.05s;
        }



        @keyframes bounce_fountainG {
            0% {
                transform: scale(1);
                background-color: rgb(10,140,140);
            }

            100% {
                transform: scale(.3);
                background-color: rgb(255,255,255);
            }
        }

    </style>


</head>

<body>


    <div id="fountainG">
        <div id="fountainG_1"></div>
        <div id="fountainG_2"></div>
        <div id="fountainG_3"></div>
        <div id="fountainG_4"></div>
        <div id="fountainG_5"></div>
        <div id="fountainG_6"></div>
        <div id="fountainG_7"></div>
        <div id="fountainG_8"></div>
    </div>


    <button onclick="start_loader()">start loader</button>
    <button onclick="stop_loader()">stop loader</button>


    <script>

        function start_loader()
        {
            document.getElementById("fountainG_1").className = "fountainG";
            document.getElementById("fountainG_2").className = "fountainG";
            document.getElementById("fountainG_3").className = "fountainG";
            document.getElementById("fountainG_4").className = "fountainG";
            document.getElementById("fountainG_5").className = "fountainG";
            document.getElementById("fountainG_6").className = "fountainG";
            document.getElementById("fountainG_7").className = "fountainG";
            document.getElementById("fountainG_8").className = "fountainG";
        }


        function stop_loader()
        {
            document.getElementById("fountainG_1").className = "";
            document.getElementById("fountainG_2").className = "";
            document.getElementById("fountainG_3").className = "";
            document.getElementById("fountainG_4").className = "";
            document.getElementById("fountainG_5").className = "";
            document.getElementById("fountainG_6").className = "";
            document.getElementById("fountainG_7").className = "";
            document.getElementById("fountainG_8").className = "";
        }

    </script>

</body>
</html>
