<!DOCTYPE html>
<html>
<head>
    
    <title></title>
	<meta charset="utf-8" />

    <style>

        button
        {
            font-size: 20px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 5px;
            background-color: darkorange;
        }

        .btnLodaer
        {
            display: flex;
            justify-content: center;
            align-items: center;
            column-gap: 4px;
        }

        #svgButtonLoader
        {
	        animation: cssload-spin .8s infinite linear;
        }

        @keyframes cssload-spin 
        {
	        100% 
            { 
                transform: rotate(360deg); 
            }
        } 
    </style>

</head>

<body>
    
    <button onclick="add_button_loader(this, 'המתן','white')">load</button>
    <br>
    <a href="#" onclick="remove_button_loader(document.querySelector('button'), 'load')">stop load</button>
   

    <script>
        function add_button_loader(button, text, loader_color)
        {
            button.disabled = true;
            button.textContent = text;
            button.style.opacity = 0.7;
            button.classList.add("btnLodaer");
            
            // Create SVG element
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("id","svgButtonLoader");
            svg.setAttribute("height", "22");
            svg.setAttribute("width", "22");
            svg.setAttribute("viewBox", "0 -960 960 960");
            
            // Create path element
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("fill", loader_color);
            path.setAttribute("d", "M160-160v-80h110l-16-14q-52-46-73-105t-21-119q0-111 66.5-197.5T400-790v84q-72 26-116 88.5T240-478q0 45 17 87.5t53 78.5l10 10v-98h80v240H160Zm400-10v-84q72-26 116-88.5T720-482q0-45-17-87.5T650-648l-10-10v98h-80v-240h240v80H690l16 14q49 49 71.5 106.5T800-482q0 111-66.5 197.5T560-170Z");

            // Append path to SVG
            svg.appendChild(path);

            // Insert SVG into button
            button.appendChild(svg);
        }

        function remove_button_loader(button, text)
        {
            button.textContent = text;
            button.style.opacity = 1;
            button.disabled = false;
            button.classList.remove("btnLodaer");
        }
    </script>
</body>
</html>
