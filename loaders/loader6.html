<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spinner Overlay Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        /* Overlay to block screen */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            /* semi-transparent black */
            display: none;
            /* hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Buttons */
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Spinner Demo</h1>
    <button onclick="showSpinner()">Show Spinner</button>
    <button onclick="hideSpinner()">Hide Spinner</button>

    <!-- Overlay with spinner -->
    <div id="overlay">
        <div id="spinner">
            <!-- SVG spinner with transparent background -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" width="200"
                height="200" style="shape-rendering:auto; display:block;">
                <g>
                    <circle fill="#00667d" r="10" cy="50" cx="84">
                        <animate begin="0s" keySplines="0 0.5 0.5 1" values="10;0" keyTimes="0;1" calcMode="spline"
                            dur="0.6944444444s" repeatCount="indefinite" attributeName="r"></animate>
                        <animate begin="0s" values="#00667d;#96d600;#29d1de;#17a1ba;#00667d"
                            keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="fill"></animate>
                    </circle>
                    <circle fill="#00667d" r="10" cy="50" cx="16">
                        <animate begin="0s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="0;0;10;10;10" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="r"></animate>
                        <animate begin="0s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="16;16;16;50;84" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="cx"></animate>
                    </circle>
                    <circle fill="#17a1ba" r="10" cy="50" cx="50">
                        <animate begin="-0.6944444444s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="0;0;10;10;10" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="r"></animate>
                        <animate begin="-0.6944444444s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="16;16;16;50;84" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="cx"></animate>
                    </circle>
                    <circle fill="#29d1de" r="10" cy="50" cx="84">
                        <animate begin="-1.3888888888s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="0;0;10;10;10" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="r"></animate>
                        <animate begin="-1.3888888888s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="16;16;16;50;84" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="cx"></animate>
                    </circle>
                    <circle fill="#96d600" r="10" cy="50" cx="16">
                        <animate begin="-2.0833333333s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="0;0;10;10;10" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="r"></animate>
                        <animate begin="-2.0833333333s" keySplines="0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1;0 0.5 0.5 1"
                            values="16;16;16;50;84" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" dur="2.7777777777s"
                            repeatCount="indefinite" attributeName="cx"></animate>
                    </circle>
                </g>
            </svg>
        </div>
    </div>

    <script>
        function showSpinner()
        {
            document.getElementById('overlay').style.display = 'flex';
        }
        function hideSpinner()
        {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>

</body>

</html>
