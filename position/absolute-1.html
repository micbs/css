<!DOCTYPE html>

<html>
<head>
    <title></title>


    <style>
    
        #div1
        {
            border:1px solid black;
            height:500px;
            width:500px;
            position:relative;
        }
    
        #div1 div
        {
            width:50px;
            height:50px;
            position:absolute;
            background-color:Yellow;
        }
    
        #div1 div:hover
        {
            background-color:Aqua;
        }
    
    </style>

</head>
<body>


<div id="div1">
    <div style="top:25px; left:25px;"></div>
    <div style="top:25px; right:25px;"></div>
    <div style="bottom:25px; left:25px;"></div>
    <div style="bottom:25px; right:25px;"></div>
</div>

</body>
</html>
