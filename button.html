<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #bootstrap
        {
            padding: 6px 12px;
            border-radius: 0.375rem;
            border: 1px solid #0d6efd;
            color: white;
            background-color: #0d6efd;
        }

        #black_transparent
        {
            padding: 8px 10px;
            border: 1px solid black;
            background-color: transparent;
        }

        .nice-button {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      color: #fff;
      background-color: #007bff;
      border: 2px solid #007bff;
      border-radius: 5px;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .nice-button:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }

    .nice-button:active {
      background-color: #004080;
      border-color: #004080;
    }
    </style>

</head>
<body>
    <button>Default Button</button>
    <button id="bootstrap">Bootstarp Button</button>
    <button id="black_transparent">Black Transparent</button>
    <a href="#" class="nice-button">Click Me</a>
</body>
</html>
