<!DOCTYPE html>

<html>

<head>

    <meta name="viewport" content="width=device-width, maximum-scale=1.0">

    <title></title>

	<meta charset="utf-8" />

    <style>

        @font-face 
        {
          font-family:OpenSansHebrew;
          src:url('../fonts/opensanshebrew-regular-webfont.woff');
          font-style:normal;
          font-weight:400;
        }


        @font-face 
        {
          font-family:OpenSansHebrewBold;
          src:url('../fonts/opensanshebrew-bold-webfont.woff');
          font-style:normal;
          font-weight:400;
        }



        body{margin:10vw 0 0 0; font-family:OpenSansHebrew; color:#333; background-color:transparent}


        body > div:nth-child(2)
        {
            border:0;
        }




        .MyGrid11
        {
            display:grid;
            width:90vw;
            
            margin-left:5vw;
            grid-template-columns:20% 20% 20% 20% 20%;
            grid-template-rows:50% 50%;
            border-top:0.2vw #AAA solid;
            /*background-color:yellow;*/
        }


        .MyGrid11 > div
        {
            /*padding:2px 5px;*/
            font-size:3vw;
        }


        .letter11
        {
            grid-column:1/2;
            grid-row:span 2;
            
            /*background-color:yellow;*/
        }

        .letter11 > img
        {
            height:50%;
            margin:25% auto 0;
            display:block;
        }

        .status11
        {
            grid-column:5/6;
            grid-row:span 2;
            padding:18%;
            /*background-color:aqua;*/
        }

        .status11 > img
        {
            width:100%;
            display:block;
        }

        .status11 > div
        {
            display:none;
        }

        .date11
        {
            grid-column:4/5;
            text-align:right;
            padding-top:1vw;
        }


        .surgeryName11
        {
            grid-column:2/4;
            text-align:right;
            padding-top:1vw;
        }


        .personId11
        {
            grid-column:4/5;
            text-align:right;
            align-self: end;
            color:#00ADEF;
            padding-bottom:1vw;
            /*background-color:fuchsia;*/
        }


        .firstName11
        {
            grid-column:3/4;
            text-align:right;
            align-self: end;
            padding-bottom:1vw;
            font-family:OpenSansHebrewBold;
            /*background-color:antiquewhite;*/
        }


        .lastName11
        {
            grid-column:2/3;
            text-align:right;
            align-self: end;
            padding-bottom:1vw;
            font-family:OpenSansHebrewBold;
            /*background-color:darksalmon;*/
        }


        .HeaderGrid11
        {
           display:none;
        }

        .surgeryCode11
        {
            display:none;
        }







        @media screen and (min-width:700px)
        {

            body > div:nth-child(2)
            {
                border-top:0.1vw #AAA solid;
            }


            .MyGrid
            {
                display:grid;
                width:80vw;
                
                margin-left:10vw;
                grid-template-columns:10fr 10fr 20fr 10fr 10fr 10fr 10fr 10fr;
                grid-template-rows:auto;
                border-top:0.1vw #AAA solid;
                /*background-color:green;*/
            }

            .MyGrid > div
            {
                font-size:1.2vw;
                background-color:transparent;
            }

            .letter
            {
                grid-column:1/2;
               
                height:60%;
                align-self: center;
                justify-self:end;
                background-color:aqua;
                
            }

            .letter > img
            {
                height:100%;
                margin:0;
            }

            .status
            {
                grid-column:2/3;
                
                align-self:center;
                justify-self:end;
                padding:0;
                background-color:aquamarine;
               
            }

            .status > img
            {
                display:none;
            }

            .status > div
            {
                display:block;
            }

            .surgeryName
            {
                grid-column:3/4;
                
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:burlywood;
                
            }

            .surgeryCode
            {
                grid-column:4/5;
                
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                text-align:right;
                display:block;
                background-color:darkseagreen;
               
            }

            .date
            {
                grid-column:5/6;
                
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:chartreuse;
                
            }

            .firstName
            {
                grid-column:6/7;
                
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                font-family:OpenSansHebrew;
                background-color:cornflowerblue;
                
            }

            .lastName
            {
                grid-column:7/8;
                
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                font-family:OpenSansHebrew;
                background-color:cadetblue;
                
            }

            .personId
            {
                grid-column:8/9;
                
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:darkorange;
                
            }


            

            .HeaderGrid1111
            {
                display:grid;
                width:80vw;
                height:3vw;
                margin-left:10vw;
                grid-template-columns:10fr 10fr 20fr 10fr 10fr 10fr 10fr 10fr;
                grid-template-rows:auto;
                /*background-color:yellow;*/
            }

            .HeaderGrid1111 > div
            {
                height:initial;
                padding:0;
                margin:0;
                align-self:center;
                justify-self:stretch;
                direction:rtl;
                font-weight:bold;
                font-size:1.2vw;
                color:black;
                background-color:transparent;
            }
        }

    </style>

</head>



<body>

    <div class="MyGrid">
    
        <div class="letter">תשובה</div>
        <div class="status">סטטוס</div>
        <div class="surgeryName">שם ניתוח</div>
        <div class="surgeryCode">קוד ניתוח</div>
        <div class="date">תאריך</div>
        <div class="firstName">פרטי</div>
        <div class="lastName">משפחה</div>
        <div class="personId">ת.ז.</div>
        
        
        <div class="letter"><img src="../images/file.png" /></div>
        <div class="status"><img src="../images/redX.png" /><div>נדחה</div></div>
        <div class="surgeryName">טיפול ברך ימין</div>
        <div class="surgeryCode">61</div> 
        <div class="date">21/11/2019</div>
        <div class="firstName">משה</div>
        <div class="lastName">אורנשטיין</div>
        <div class="personId">032989653</div>
        
        
        
        
   
        <div class="letter"><img src="../images/file.png" /></div>
        <div class="lastName">לוי</div>
        <div class="firstName">דנה</div>
        <div class="personId">83730986</div>
        <div class="status"><img src="../images/greenV.png" /><div>אושר</div></div>
        <div class="surgeryName">טיפול ברך ימין / השתלה מלאה</div>
        <div class="date">02/05/2012</div>
        <div class="surgeryCode">65</div>

    </div>

    

</body>

</html>
