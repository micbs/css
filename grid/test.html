<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, maximum-scale=1.0">

    <title></title>

    <meta charset="utf-8" />
    
    <h2>work with justify-items and align-items</h2>

    <style>

        #MyGrid
        {
            width:500px;
            display:grid;
            grid-template-columns:1fr 1fr;
            outline:1px solid black;
        }

        textarea
        {
            display: block;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

    </style>

</head>

<body>

    <div id="MyGrid">
        <div style="background-color:yellow">
            <textarea></textarea>
        </div>
        <div style="background-color:greenyellow; font-size: 50px;">
            Hello
        </div>
    </div>

</body>
</html>
