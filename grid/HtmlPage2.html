<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />

    <style>

        body{margin:0}

        .grid-container
        {
            display:grid;
            grid-template-columns:1fr 1fr;
            grid-template-rows:50px;
        }

        .grid-container > div
        {
            outline:1px solid black;
            text-align:center;
            padding:10px;
        }

        .cellx2
        {
            grid-column-start:1;
            grid-column-end:3;
            background-color:yellow;
        }


        .rowx2
        {
            grid-row:span 2;
            background-color:greenyellow;
        }

    </style>

</head>
<body>

    <div class="grid-container">
        <div class="rowx2">1</div>
        <div>2</div>
        <div>3</div>
        <div class="rowx2">4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
    </div>


</body>
</html>
