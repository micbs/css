<!DOCTYPE html>

<html>

<head>

    <meta name="viewport" content="width=device-width, maximum-scale=1.0">

    <title></title>

	<meta charset="utf-8" />

    <style>

        @font-face 
        {
          font-family:OpenSansHebrew;
          src:url('../fonts/opensanshebrew-regular-webfont.woff');
          font-style:normal;
          font-weight:400;
        }


        @font-face 
        {
          font-family:OpenSansHebrewBold;
          src:url('../fonts/opensanshebrew-bold-webfont.woff');
          font-style:normal;
          font-weight:400;
        }



        body{margin:0; font-family:OpenSansHebrew; color:#333; background-color:transparent}


        .MyGrid
        {
            display:grid;
            width:100vw;
            height:20vw;
            
            grid-template-columns:20% 5% 35% 20% 20%;
            grid-template-rows:50% 50%;
            background-color:white;
        }


        .MyGrid > div
        {
            /*padding:2px 5px;*/
            font-size:3vw;
        }


        .letter
        {
            grid-column:1/2;
            grid-row:span 2;
            
            /*background-color:yellow;*/
        }

        .letter > img
        {
            height:50%;
            margin:25% auto 0;
            display:block;
        }

        .status
        {
            grid-column:5/6;
            grid-row:span 2;
            padding:18%;
            /*background-color:aqua;*/
        }

        .status > img
        {
            width:100%;
            display:block;
        }


        .date
        {
            grid-column:4/5;
            text-align:right;
            padding-bottom:5px;
            /*align-self: start;
            justify-self:end;
            margin-right:5%;*/
            /*background-color:greenyellow;*/
        }


        .surgeryName
        {
            grid-column:2/4;
            text-align:right;
            padding-bottom:5px;
            /*align-self: start;
            justify-self:end;*/
            /*background-color:darkseagreen;*/
        }


        .personId
        {
            grid-column:4/5;
            text-align:right;
            align-self: end;
            color:#00ADEF;
            padding-bottom:5px;
            /*background-color:fuchsia;*/
        }


        .firstName
        {
            grid-column:3/4;
            text-align:right;
            align-self: end;
            padding-bottom:5px;
            font-family:OpenSansHebrewBold;
            /*background-color:antiquewhite;*/
        }


        .lastName
        {
            grid-column:2/3;
            text-align:right;
            align-self: end;
            padding-bottom:5px;
            font-family:OpenSansHebrewBold;
            /*background-color:darksalmon;*/
        }


        .HeaderGrid
        {
           display:none;
        }


        @media screen and (min-width:700px)
        {
            .MyGrid
            {
                display:grid;
                width:80vw;
                height:4vw;
                margin-left:10vw;
                grid-template-columns:5fr 5fr 10fr 10fr 5fr 10fr 10fr 10fr;
                grid-template-rows:auto;
                border-top:0.2vw #f0f0f0 solid;
                background-color:white;
            }

            
            .MyGrid > div
            {
                font-size:1.2vw;
                background-color:transparent;
            }

            
            .letter
            {
                grid-column:1/2;
                grid-row:1;
                height:60%;
                align-self: center;
                justify-self:center;
                background-color:aqua;
            }

            
            .letter > img
            {
                height:100%;
                margin:0;
            }


            .status
            {
                grid-column:2/3;
                grid-row:1;
                /*align-self: center;
                justify-self:center;*/
                background-color:aquamarine;
            }


            .status > img
            {
                display:none;
            }


            .surgeryName
            {
                grid-column:3/4;
                grid-row:1;
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:burlywood;
            }

            
            .date
            {
                grid-column:4/5;
                grid-row:1;
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:chartreuse;
            }


            .surgeryCode
            {
                grid-column:5/6;
                grid-row:1;
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                text-align:right;
                background-color:darkseagreen;
            }


        
            .firstName
            {
                grid-column:6/7;
                grid-row:1;
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:cornflowerblue;
            }


            .lastName
            {
                grid-column:7/8;
                grid-row:1;
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:cadetblue;
            }

            
            .personId
            {
                grid-column:8/9;
                grid-row:1;
                align-self: center;
                justify-self:stretch;
                padding:0;
                margin:0;
                background-color:darkorange;
            }


            
            .HeaderGrid
            {
                display:grid;
                width:80vw;
                height:3vw;
                margin-left:10vw;
                grid-template-columns:5fr 5fr 10fr 10fr 5fr 10fr 10fr 10fr;
                grid-template-rows:auto;
                
                /*background-color:yellow;*/
            }

            .HeaderGrid > div
            {
                height:initial;
                padding:0;
                margin:0;
                align-self:center;
                justify-self:stretch;
                direction:rtl;
                font-weight:bold;
                font-size:1.2vw;
                color:black;
                background-color:transparent;
            }


        }

    </style>

</head>



<body>


    


    <div class="HeaderGrid">
        <div class="letter">תשובה</div>
        <div class="lastName">משפחה</div>
        <div class="firstName">פרטי</div>
        <div class="personId">ת.ז.</div>
        <div class="status">סטטוס</div>
        <div class="surgeryName">שם ניתוח</div>
        <div class="date">תאריך</div>
        <div class="surgeryCode">קוד ניתוח</div>
    </div>


    <div class="MyGrid">
        <div class="letter"><img src="../images/file.png" /></div>
        <div class="lastName">אורנשטיין</div>
        <div class="firstName">משה</div>
        <div class="personId">032989653</div>
        <div class="status"><img src="../images/redX.png" /></div>
        <div class="surgeryName">טיפול ברך ימין</div>
        <div class="date">21/11/2019</div>
        <div class="surgeryCode">61</div> 
    </div>



    

</body>

</html>
