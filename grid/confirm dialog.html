<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>



    <style>
        .TransparentBackground
        {
            position:fixed; top:0px; left:0px; width:100%; height:100%; background-color:rgba(0, 0, 0, 0);
            display:flex; justify-content:center; align-items:center; z-index:2000;
        }

        .confirm-dialog-window
        {
            max-width: 600px;
            display:grid;
            grid-template-columns: 1fr 1fr;
            padding: 30px;
            column-gap: 60px;
            box-shadow: 5px 5px 10px #888888;
            box-sizing: border-box;
            background-color: white;
        }

        .confirm-dialog-window .text
        {
            justify-self: stretch; 
            /* background-color: aqua; */
        }

        .confirm-dialog-window .text .title
        {
            text-align: right;
        }

        .confirm-dialog-window .text .body
        {
            text-align: right; direction: rtl;
        }

        .confirm-dialog-window img
        {
            width: 100%;
        }

        .confirm-dialog-window .buttons
        {
            text-align: end; 
            padding-top: 20px;
            /* background-color: darkgreen; */
        }

        .confirm-dialog-window .buttons button
        {
            
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
            padding: 8px 20px;
            font-size: 20px;
        }

        .confirm-dialog-window .buttons .approval
        {
            background-color: #00adef;
            color: white;
            border: none;
            margin-right: 10px;
        }

        .confirm-dialog-window .buttons .cancel
        {
            background-color: transparent;
            border:1px solid #00adef;
            color: #00adef;
        }



        @media screen and (max-width:700px)
        {
            .confirm-dialog-window
            {
                width: 80%;
            }
        }



        @media screen and (max-width:620px)
        {
            .confirm-dialog-window .buttons button
            {
                display: block;
            }

            .confirm-dialog-window .buttons .approval
            {
                margin-left: auto;
                margin-right: 0;
            }

            .confirm-dialog-window .buttons .cancel
            {
                margin-left: auto;
                margin-right: 0;
                margin-top: 12px;
            }
            
        }


        @media screen and (max-width:500px)
        {
            .confirm-dialog-window
            {
                grid-template-columns: 1fr;
            }

            .confirm-dialog-window img
            {
                display: none;
            }
        }


    </style>


</head>
<body>
    
    <div class="TransparentBackground">
        <div class="confirm-dialog-window">
            <div class="text">
                <h3 class="title">בדיקת תקינות</h3>
                <p class="body">תעודת זהות הותקנה עם נתונים חלקיים האם התכוונת ל: נטע דובינסקי</p>
                <div class="buttons">
                    <button class="approval">אישור</button>
                    <button class="cancel">ביטול</button>
                </div>
            </div>
            <img src="../images/confirm.png">
        </div>
    </div>

</body>
</html>
