<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, maximum-scale=1.0">

    <title></title>

    <meta charset="utf-8" />
    
    <h2>work with justify-items and align-items</h2>

    <style>

        #MyGrid
        {
            width:500px;
            display:grid;
            grid-template-columns:100px 100px 100px;
            justify-items: unset;
            align-items:unset;
            outline:1px solid black;
        }

        #MyGrid > div{width: 50px;}

    </style>

</head>

<body>

    <div id="MyGrid">
        <div style="background-color:yellow">1</div>
        <div style="margin-left:0px; background-color:red">2</div>
        <div style="background-color:green">3</div>
        <div style="background-color:rgb(66, 218, 117)">44444 44444 4444</div>
        <div style="background-color:aqua">5</div>
        <div style="background-color:cornflowerblue">6</div>
        <div style="background-color:deeppink">7</div>
    </div>

</body>
</html>
