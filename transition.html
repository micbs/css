<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />


    <style>
       
        body{margin:0}

        div{
            width:400px;
            height:100px;
            background-color:green;
            transition:width 2s, height 3s;
        }

        div:hover
        {
            width:800px;
        }


    </style>

</head>

<body>

   <div></div>



    <script>

        // click event on the div
        document.querySelector("div").addEventListener("click", function () { this.style.height = "500px"; });

    </script>


</body>
</html>
