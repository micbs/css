<!DOCTYPE html>
<html>
<head>
    <title></title>
	<meta charset="utf-8" />


    <style>
       
        #div1
        {
            width:400px;
            height:100px;
            background-color:green;
            transition:width 2s, height 3s;
        }

        #div1:hover
        {
            width:800px;
        }


        #div2
        {
            width:400px;
            height:100px;
            margin-top: 20px;
            opacity: 0;
            background-color:blue;
            transition:opacity 1s;
        }


    </style>

</head>

<body>

    <div id="div1"></div>

    <hr>

    <button onclick="show_div()">show div</button>

    <div id="div2"></div>


    <script>

        // click event on the div
        document.querySelector("#div1").addEventListener("click", function () { 
            this.style.height = "200px"; 
        });


        function show_div()
        {
            document.querySelector("#div2").style.opacity = 1;
            
            setTimeout(function(){
                document.querySelector("#div2").style.opacity = 0;
            },3000);
        }

    </script>


</body>
</html>
