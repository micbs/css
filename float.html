<!DOCTYPE html>

<html>
<head>
    <title></title>
</head>

<body style="margin:0">

    <div style="width:150px; height:100px; float:left; background-color:Red"></div>
    <div style="width:150px; height:100px; float:right; background-color:Green"></div>
    
    <div style="width:100px; height:100px; clear:both"></div>

    <div style="width:300px; height:100px; float:left; background-color:blue">300px</div>
    <div style="width:300px; height:100px; float:left; background-color:yellow">300px</div>
    <div style="width:300px; height:100px; float:left; background-color:yellowgreen">300px</div>
    <div style="width:300px; height:100px; float:left; background-color:orange">300px</div>


    <div style="width:100px; height:100px; clear:both"></div>

    <div style="width:20%; height:100px; float:left; background-color:blue">20%</div>
    <div style="width:20%; height:100px; float:left; background-color:yellow">20%</div>
    <div style="width:20%; height:100px; float:left; background-color:yellowgreen">20%</div>
    <div style="width:20%; height:100px; float:left; background-color:orange">20%</div>

</body>
</html>
